name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: zatresi
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: zatresi-api_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U zatresi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y curl libjemalloc2 libvips libpq-dev

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # levenshtein-ffi does not declare its C extension in the gemspec, so
      # bundler never compiles it (the Dockerfile builds it manually too)
      - name: Build levenshtein-ffi native extension
        run: |
          cd "$(bundle show levenshtein-ffi)/ext/levenshtein"
          ruby extconf.rb
          make CFLAGS="-fPIC -Wno-incompatible-pointer-types"

      - name: Run tests
        env:
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bin/rails db:test:prepare
          bundle exec rspec spec/

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    needs: [scan_ruby, lint, test]
    runs-on: ubuntu-latest
    concurrency: fly-deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # fly-cron-manager provisions a fresh machine per cron run from the
      # :latest tag, so each deploy must move that tag to the new image
      - name: Point :latest at the deployed image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker
          IMAGE=$(flyctl machine list --json | jq -r '[.[] | select(.config.metadata.fly_process_group == "app")][0].config.image')
          docker buildx imagetools create --tag registry.fly.io/klubi-si-api:latest "$IMAGE"
